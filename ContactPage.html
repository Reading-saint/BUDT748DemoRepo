<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | BMGT407</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fa;
      }

      .contact-hero {
        background: linear-gradient(135deg, #212529, #495057);
        color: #ffffff;
        padding: 5rem 1rem;
      }

      .contact-content {
        margin-top: -2rem;
      }

      .contact-card {
        height: 100%;
        border: 0;
        box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.08);
      }

      .contact-intro {
        font-size: 1.1rem;
        line-height: 1.8;
        color: #495057;
      }

      .contact-person {
        padding: 2rem;
        border-radius: 8px;
        background-color: #ffffff;
        border-left: 4px solid #212529;
      }

      .contact-role {
        color: #6c757d;
        font-size: 0.9rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.5rem;
      }

      .contact-name {
        font-size: 1.2rem;
        font-weight: 600;
        color: #212529;
        margin-bottom: 0.5rem;
      }

      .contact-email {
        color: #007bff;
        text-decoration: none;
      }

      .contact-email:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.HTML">BMGT407</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.HTML">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <header class="contact-hero text-center">
      <div class="container">
        <h1 class="display-5 fw-bold mb-0">Contact Us</h1>
      </div>
    </header>

    <main class="container contact-content pb-5">
      <section class="card contact-card mb-5">
        <div class="card-body p-4 p-md-5">
          <p class="contact-intro">
            Reach out to the course team for support or inquiries. We're here to
            help with any questions you may have about BUDT748.
          </p>
        </div>
      </section>

      <section aria-label="Contact information">
        <h2 class="h4 fw-bold mb-4">Course Team</h2>
        
        <div class="row g-4">
          <div class="col-md-6">
            <div class="contact-person">
              <p class="contact-role">Professor</p>
              <h3 class="contact-name">Paul T. Shapiro</h3>
              <a href="mailto:pshapiro@umd.edu" class="contact-email">
                pshapiro@umd.edu
              </a>
            </div>
          </div>

          <div class="col-md-6">
            <div class="contact-person">
              <p class="contact-role">Teaching Assistant</p>
              <h3 class="contact-name">Archit Tiwari</h3>
              <a href="mailto:atiwari@umd.edu" class="contact-email">
                atiwari@umd.edu
              </a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    ></script>
  </body>
</html>
