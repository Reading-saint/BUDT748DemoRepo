<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BUDT748 Landing Page</title>
    <style>
      :root {
        --bg-dark: #0f172a;
        --bg-panel: rgba(15, 23, 42, 0.72);
        --card-light: rgba(255, 255, 255, 0.08);
        --accent: #8b5cf6;
        --accent-2: #3b82f6;
        --text: #e2e8f0;
        --muted: #cbd5e1;
        --highlight: #f8fafc;
        --shadow: 0 20px 45px rgba(15, 23, 42, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #020817 0%, #111827 45%, #1e1b4b 100%);
        color: var(--text);
      }

      .landing-page {
        width: min(1200px, calc(100% - 32px));
        margin: 0 auto;
        min-height: 100vh;
        padding: 32px 0 64px;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 24px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.35);
        backdrop-filter: blur(10px);
        box-shadow: var(--shadow);
      }

      .brand {
        font-size: clamp(1.4rem, 2vw, 2rem);
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 30px;
        flex-wrap: wrap;
      }

      .nav a {
        text-decoration: none;
        color: var(--muted);
        font-weight: 600;
        transition: color 0.2s ease;
      }

      .nav a:hover {
        color: var(--highlight);
      }

      .hero {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        align-items: center;
        gap: 32px;
        flex: 1;
        padding: 56px 24px 0;
      }

      .content {
        max-width: 620px;
      }

      .eyebrow {
        display: inline-block;
        margin-bottom: 18px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(139, 92, 246, 0.14);
        border: 1px solid rgba(139, 92, 246, 0.38);
        color: #ddd6fe;
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .headline {
        margin: 0;
        font-size: clamp(2.5rem, 5vw, 5rem);
        line-height: 0.98;
        letter-spacing: -0.06em;
        font-weight: 800;
      }

      .headline .gradient {
        background: linear-gradient(135deg, #c4b5fd 0%, #7dd3fc 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .subtext {
        margin-top: 20px;
        color: var(--muted);
        font-size: clamp(1rem, 1.6vw, 1.25rem);
        line-height: 1.7;
        max-width: 560px;
      }

      .cta-row {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 30px;
      }

      .primary-btn,
      .secondary-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 16px 28px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .primary-btn {
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
        color: white;
        box-shadow: 0 16px 32px rgba(59, 130, 246, 0.35);
      }

      .secondary-btn {
        background: rgba(15, 23, 42, 0.35);
        color: var(--text);
        border: 1px solid rgba(148, 163, 184, 0.28);
      }

      .primary-btn:hover,
      .secondary-btn:hover {
        transform: translateY(-2px);
      }

      .hero-visual {
        display: flex;
        justify-content: center;
      }

      .feature-card {
        position: relative;
        width: min(420px, 100%);
        min-height: 470px;
        padding: 24px;
        border-radius: 32px;
        background: linear-gradient(160deg, rgba(148, 163, 184, 0.2), rgba(15, 23, 42, 0.75));
        border: 1px solid rgba(148, 163, 184, 0.22);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .feature-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.35), transparent 34%);
      }

      .card-inner {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .mini-label {
        align-self: flex-start;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.5);
        border: 1px solid rgba(148, 163, 184, 0.2);
        color: var(--muted);
        font-size: 0.8rem;
      }

      .mock-window {
        flex: 1;
        margin-top: 24px;
        border-radius: 24px;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.6), rgba(2, 6, 23, 0.9));
        border: 1px solid rgba(148, 163, 184, 0.2);
        padding: 18px;
      }

      .window-header {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .dot.red { background: #f87171; }
      .dot.yellow { background: #fbbf24; }
      .dot.green { background: #34d399; }

      .window-body {
        display: grid;
        gap: 12px;
      }

      .bar {
        height: 14px;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(96, 165, 250, 0.35), rgba(139, 92, 246, 0.6));
      }

      .bar.short { width: 65%; }
      .bar.medium { width: 80%; }
      .bar.long { width: 100%; }

      .floating-badge {
        position: absolute;
        right: 20px;
        bottom: 20px;
        padding: 12px 16px;
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        box-shadow: 0 12px 20px rgba(0, 0, 0, 0.25);
        color: #e2e8f0;
        font-weight: 700;
      }

      @media (max-width: 760px) {
        .landing-page {
          width: min(100% - 24px, 1200px);
          padding-top: 18px;
        }

        .topbar {
          flex-direction: column;
          align-items: flex-start;
          gap: 16px;
        }

        .nav {
          gap: 14px 20px;
        }

        .hero {
          grid-template-columns: 1fr;
          padding-top: 30px;
        }

        .cta-row {
          flex-direction: column;
          align-items: stretch;
        }

        .primary-btn,
        .secondary-btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="landing-page">
      <header class="topbar">
        <div class="brand">BUDT748</div>
        <nav class="nav" aria-label="Main navigation">
          <a href="#">Homepage</a>
          <a href="#">About</a>
          <a href="#">Contact</a>
        </nav>
      </header>

      <main class="hero">
        <section class="content" aria-labelledby="landing-title">
          <div class="eyebrow">Creative studio</div>
          <h1 class="headline" id="landing-title">
            LET&apos;S CREATE<br />
            <span class="gradient">A WEBSITE DESIGN</span>
          </h1>
          <p class="subtext">
            Today let&apos;s create a sample website design in Figma and export its
            corresponding HTML and CSS code.
          </p>
          <div class="cta-row">
            <a href="#" class="primary-btn">Get Started</a>
            <a href="#" class="secondary-btn">Learn More</a>
          </div>
        </section>

        <aside class="hero-visual" aria-label="Design preview">
          <div class="feature-card">
            <div class="card-inner">
              <div class="mini-label">UI Concept</div>
              <div class="mock-window">
                <div class="window-header">
                  <span class="dot red"></span>
                  <span class="dot yellow"></span>
                  <span class="dot green"></span>
                </div>
                <div class="window-body">
                  <div class="bar long"></div>
                  <div class="bar medium"></div>
                  <div class="bar short"></div>
                  <div class="bar long"></div>
                  <div class="bar medium"></div>
                </div>
              </div>
            </div>
            <div class="floating-badge">+ Design Ready</div>
          </div>
        </aside>
      </main>
    </div>
  </body>
</html>
