<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact the BUDT748 course team for support and inquiries." />
    <title>Contact — BUDT748</title>
    <link rel="stylesheet" href="./vars.css" />
    <link rel="stylesheet" href="./style.css" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body,
      div,
      span,
      applet,
      object,
      iframe,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      p,
      blockquote,
      pre,
      a,
      abbr,
      acronym,
      address,
      big,
      cite,
      code,
      del,
      dfn,
      em,
      img,
      ins,
      kbd,
      q,
      s,
      samp,
      small,
      strike,
      strong,
      sub,
      sup,
      tt,
      var,
      b,
      u,
      i,
      center,
      dl,
      dt,
      dd,
      ol,
      ul,
      li,
      fieldset,
      form,
      label,
      legend,
      table,
      caption,
      tbody,
      tfoot,
      thead,
      tr,
      th,
      td,
      article,
      aside,
      canvas,
      details,
      embed,
      figure,
      figcaption,
      footer,
      header,
      hgroup,
      menu,
      nav,
      output,
      ruby,
      section,
      summary,
      time,
      mark,
      audio,
      video {
        margin: 0;
        padding: 0;
        border: 0;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      button,
      input,
      select,
      textarea {
        background: none;
        border: none;
        font-family: inherit;
      }

      menu,
      ol,
      ul {
        list-style-type: none;
      }

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    </style>
  </head>
  <body>
    <div class="contact-page">
      <header class="page-header">
        <div class="logo">BUDT748</div>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="./index.html">Homepage</a>
          <a href="./about.html">About</a>
          <a href="./contact.html">Contact</a>
        </nav>
      </header>

      <main class="contact-container">
        <section class="contact-section">
          <h1>Contact Us</h1>
          <p class="contact-intro">
            Reach out to the course team for support or inquiries.
          </p>

          <address class="contact-info">
            <div class="contact-item">
              <h2>Professor</h2>
              <div class="contact-details">
                <p class="name">Paul T. Shapiro</p>
                <a href="mailto:pshapiro@umd.edu" class="email-link">pshapiro@umd.edu</a>
              </div>
            </div>

            <div class="contact-item">
              <h2>Teaching Assistant</h2>
              <div class="contact-details">
                <p class="name">Archit Tiwari</p>
                <a href="mailto:atiwari@umd.edu" class="email-link">atiwari@umd.edu</a>
              </div>
            </div>
          </address>
        </section>
      </main>
    </div>
  </body>
</html>
